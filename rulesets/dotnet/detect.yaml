id: dotnet
description: C# / .NET with ASP.NET Core, EF Core, hosted services, typed HttpClient
project_markers: ['*.sln', '*.csproj']
file_patterns:
  - '**/*.cs'
  - '**/*.csproj'
  - '**/*.sln'
  - '**/*.props'
  - '**/*.targets'
  - '**/appsettings*.json'
  - '**/launchSettings.json'
  - '**/*.razor'
  - '**/*.cshtml'
source_patterns: ['**/*.cs']
reference_globs: ['**/*.cs', '**/*.razor', '**/*.cshtml', '**/appsettings*.json']
test_patterns:
  - '**/tests/**'
  - '**/test/**'
  - '**/*.Tests/**'
  - '**/*.Test/**'
  - '**/*.UnitTests/**'
  - '**/*.IntegrationTests/**'
  - '**/*Tests.cs'
  - '**/*Test.cs'
migration_patterns:
  - '**/Migrations/**'
migration_ignore:
  # regenerated on every new migration — not an edit of an applied migration
  - '**/*ModelSnapshot.cs'
  - '**/*.Designer.cs'
# regenerated by tooling alongside a real change: listed, not analysed
generated_companions:
  - '**/*ModelSnapshot.cs'
exclude:
  - '**/bin/**'
  - '**/obj/**'
  - '**/*.Designer.cs'
  - '**/*.g.cs'
  - '**/*.g.i.cs'
  - '**/*.AssemblyInfo.cs'
  - '**/.vs/**'
  - '**/TestResults/**'
import_patterns:
  - '^\s*(global\s+)?using\s+(static\s+)?[\w.]+(\s*=\s*[\w.<>]+)?;\s*$'
  - '^\s*namespace\s+[\w.]+;?\s*$'
comment_patterns:
  - '^\s*(//|/\*|\*|\*/)'
  - '^\s*#(region|endregion|nullable|pragma)\b'
symbol_patterns:
  - '^\s*(?:public\s+|internal\s+|protected\s+|private\s+)*(?:static\s+|sealed\s+|abstract\s+|partial\s+|readonly\s+|file\s+)*(?:class|interface|record(?:\s+struct|\s+class)?|struct|enum)\s+([A-Z]\w*)'
assertion_patterns:
  - '\bAssert\.\w+\s*\('
  - '\.Should\(\)'
  - '\.Should\w*\s*\('
  - '\bVerify\s*\('
  - '\.Verify\w*\s*\('
  - '\bExpect\w*\s*\('
  - '\bThrowsAsync\s*<|\bThrows\s*<'
skip_patterns:
  - '\[Fact\s*\(\s*Skip\s*='
  - '\[Theory\s*\(\s*Skip\s*='
  - '\[Ignore\b'
  - '\[Skip\b'
  - 'Skip\s*=\s*"'
  - '\[Explicit\b'
module_patterns:
  # src/Shop.Api/Controllers/X.cs -> Shop.Api/Controllers ; tests/Shop.Tests/X.cs -> Shop.Tests
  - '^(?:src|tests?|test)/([^/]+)/(?:([A-Z][^/]*)/)?'
  - '^([^/]+\.[A-Z][^/]*)/(?:([A-Z][^/]*)/)?'
test_name_map:
  - from: '^(.+)\.cs$'
    to: ['\1Tests.cs', '\1Test.cs', '\1IntegrationTests.cs', '\1UnitTests.cs']
