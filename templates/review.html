<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="code-review-assistant render_report.py">
<title>@@TITLE@@</title>
<style>
@@BASE_CSS@@
</style>
<style>
/* ---------- review ---------- */
.rv-head { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 980px) { .rv-head { grid-template-columns: minmax(0, 1fr); } }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-bottom: 10px; }
.stat { background: var(--surface-2); border-radius: 5px; padding: 6px 9px; min-width: 0; }
.stat .k { font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; white-space: nowrap; }
.stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 5px 10px; align-items: baseline; font-size: 12px; }
.kv > .k { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.kv > .v { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.chip.ok::before { content: "\2713"; color: var(--ok); font-weight: 800; }
.chip.miss { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.lim li { color: var(--text-2); }
.lim .ico { color: var(--warn); }

.sevs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
@media (max-width: 700px) { .sevs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stile {
  --c: var(--sev-info); --bg: var(--sev-info-bg);
  display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
  border-top: 5px solid var(--c); background: var(--surface); cursor: pointer; text-align: left; box-shadow: var(--shadow);
}
.stile:hover { background: var(--bg); }
.stile .n { font-size: 30px; font-weight: 800; line-height: 1; color: var(--c); font-variant-numeric: tabular-nums; }
.stile .l { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
.stile .d { font-size: 11px; color: var(--text-3); }
.stile.zero .n { color: var(--text-3); }
.stile.sel { outline: 2px solid var(--c); outline-offset: 1px; background: var(--bg); }
.stile.blocker { --c: var(--sev-blocker); --bg: var(--sev-blocker-bg); }
.stile.blocker:not(.zero) { background: var(--sev-blocker); border-color: var(--sev-blocker); }
.stile.blocker:not(.zero) .n, .stile.blocker:not(.zero) .l, .stile.blocker:not(.zero) .d { color: #fff; }
.stile.blocker.sel { outline-color: var(--text); }
.stile.major { --c: var(--sev-major); --bg: var(--sev-major-bg); }
.stile.minor { --c: var(--sev-minor); --bg: var(--sev-minor-bg); }

.cats { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 34px; gap: 4px 10px; align-items: center; font-size: 12px; }
.cats .r { display: contents; cursor: pointer; }
.cats .r > * { padding: 2px 0; }
.cats .r:hover .cl { color: var(--accent); }
.cats .r.sel .cl { color: var(--accent); font-weight: 700; }
.cats .r.zero .cl, .cats .r.zero .cn { color: var(--text-3); }
.cats .cl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
.cats .cn { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.sbar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; background: var(--surface-2); gap: 1px; }
.sbar i { display: block; height: 100%; }
.sbar i.blocker { background: var(--sev-blocker); } .sbar i.major { background: var(--sev-major); }
.sbar i.minor { background: var(--sev-minor); } .sbar i.info { background: var(--sev-info); }
.sev-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--text-3); }
.sev-legend span { display: inline-flex; gap: 4px; align-items: center; }
.sev-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* spec */
.cov { display: flex; height: 18px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface-2); }
.cov span { display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; color: #fff; min-width: 0; overflow: hidden; white-space: nowrap; }
.cov-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-2); margin-top: 6px; }
.cov-legend span { display: inline-flex; gap: 5px; align-items: center; }
.cov-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.c-implemented { background: var(--ok); } .c-partial { background: var(--warn); } .c-missing { background: var(--sev-blocker); }
.c-contradicted { background: var(--st-contra); } .c-unclear { background: var(--text-3); }
.stb { display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px; border-radius: 3px; font-size: 10.5px; font-weight: 700; white-space: nowrap; text-transform: uppercase; letter-spacing: .03em; }
.stb.implemented, .stb.followed, .stb.yes { background: var(--ok-bg); color: var(--ok); }
.stb.implemented::before, .stb.followed::before, .stb.yes::before { content: "\2713"; }
.stb.partial { background: var(--warn-bg); color: var(--warn); }
.stb.partial::before { content: "\25D0"; }
.stb.missing, .stb.no { background: var(--sev-blocker-bg); color: var(--sev-blocker); }
.stb.missing::before, .stb.no::before { content: "\2715"; }
.stb.contradicted, .stb.deviated { background: var(--st-contra-bg); color: var(--st-contra); border: 1px solid var(--st-contra); }
.stb.contradicted::before, .stb.deviated::before { content: "\21C4"; }
.stb.unclear, .stb.not_applicable, .stb.unknown { background: var(--surface-3); color: var(--text-3); border: 1px dashed var(--border-strong); }
.ev { display: flex; flex-wrap: wrap; gap: 4px; }
.ev a { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--border); cursor: pointer; color: var(--text-2); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.ev a:hover { border-color: var(--border-strong); color: var(--text); text-decoration: none; }
.ev a.nolink { cursor: default; }
.note-c { color: var(--text-2); font-size: 12px; }
tr.mismatch td { background: var(--sev-blocker-bg); }
tr.mismatch td.act { color: var(--sev-blocker); font-weight: 700; }
.match { font-weight: 800; font-size: 14px; }
.match.yes { color: var(--ok); } .match.no { color: var(--sev-blocker); }
.tbl td.mono { font-family: var(--mono); font-size: 12px; }

/* toolbar + findings */
.toolbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 8px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}
.toolbar .search { flex: 1 1 200px; max-width: 320px; }
.toolbar .select { max-width: 220px; }
.toolbar .count { color: var(--text-3); font-size: 12px; margin-left: auto; white-space: nowrap; }
.grp { margin-top: 12px; }
.grp-h { display: flex; align-items: center; gap: 8px; padding: 6px 2px; cursor: pointer; user-select: none; flex-wrap: wrap; }
.grp-h .tw { color: var(--text-3); font-size: 11px; width: 10px; transition: transform .12s; }
.grp.collapsed .tw { transform: rotate(-90deg); }
.grp.collapsed .rows { display: none; }
.grp-h .gt { font-weight: 700; font-size: 13px; }
.grp-h .gr { color: var(--text-3); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
.rows { border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.fr { border-top: 1px solid var(--border); }
.fr:first-child { border-top: 0; }
.fr.s-blocker { box-shadow: inset 4px 0 0 var(--sev-blocker); }
.fh {
  display: grid; grid-template-columns: 70px 130px minmax(0, 1fr) minmax(120px, 0.7fr) 74px 12px; gap: 10px; align-items: center;
  padding: 6px 10px 6px 12px; cursor: pointer; min-height: 32px;
}
.fh:hover { background: var(--surface-2); }
.fr.cur > .fh { background: var(--accent-bg); }
.fr.open > .fh { background: var(--surface-2); border-bottom: 1px solid var(--border); }
.fh .cat { font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fh .ttl { font-weight: 600; font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fr.inferred .ttl { font-style: italic; font-weight: 500; }
.fh .loc { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.fh .loc bdi { direction: ltr; }
.fh .caret { color: var(--text-3); font-size: 11px; transition: transform .12s; }
.fr.open .caret { transform: rotate(90deg); }
@media (max-width: 860px) {
  .fh { grid-template-columns: 70px minmax(0, 1fr) 74px 12px; }
  .fh .cat { display: none; }
  .fh .loc { grid-column: 2 / -1; grid-row: 2; }
}
.fd { padding: 10px 14px 12px 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .fd { grid-template-columns: minmax(0, 1fr); } }
.fd .bh { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin: 0 0 4px; }
.fd .blk + .blk { margin-top: 12px; }
.fd .desc { font-size: 13px; }
.sugg { border: 1px solid var(--ok); background: var(--ok-bg); border-radius: 5px; padding: 7px 10px; font-size: 12.5px; color: var(--text); }
.sugg::before { content: "\2192  "; color: var(--ok); font-weight: 800; }
.rel li { font-size: 12px; align-items: baseline; }
.rel .loc2 { font-family: var(--mono); font-size: 11.5px; }
.meta-line { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--text-3); }
details.tc { margin-top: 18px; }
details.tc > summary { padding: 6px 0; font-size: 13px; gap: 8px; }
details.tc .tc-t { font-weight: 700; }
.fr.unconf { opacity: .65; }
.fr.unconf .sev.blocker { background: var(--sev-blocker-bg); color: var(--sev-blocker); }
.fh .ttl .cert-tag { font-weight: 400; font-style: normal; }
.cert-tag.low { color: var(--warn); font-weight: 700; }
.files-tbl td.p { font-family: var(--mono); font-size: 11.5px; }
.files-tbl tr.click { cursor: pointer; }
.files-tbl tr.click:hover td { background: var(--surface-2); }
.files-tbl tr.sel td { background: var(--accent-bg); }
.cnts { display: inline-flex; gap: 3px; }
.cnts .sev { min-width: 0; height: 16px; font-size: 9.5px; padding: 0 5px; }
.cnts .sev.blocker::before { display: none; }
</style>
</head>
<body>
<div class="page" id="app"><noscript><p style="padding:20px">This report renders with JavaScript. Enable it to view the review.</p></noscript></div>
<script type="application/json" id="cra-data">@@DATA_JSON@@</script>
<script>
@@COMPONENTS_JS@@
</script>
<script>
(function () {
  'use strict';
  var C = window.CRA, h = C.h, arr = C.arr, obj = C.obj, str = C.str, num = C.num, strs = C.strs;
  var app = document.getElementById('app');
  var raw = C.readJson('cra-data');
  if (!raw || raw.__error || typeof raw !== 'object') {
    C.fatal(app, raw && raw.__error ? 'The embedded review is not valid JSON (' + raw.__error + ').' : 'No review data is embedded.');
    return;
  }
  var R = obj(raw);
  C.initTooltip();

  /* ================================================================ */
  /* constants + normalisation                                        */
  /* ================================================================ */
  var KINDS = { ai: 'AI review', security: 'Security review', spec: 'Spec review' };
  var kind = KINDS[str(R.kind)] ? str(R.kind) : '';
  var SEVS = ['blocker', 'major', 'minor', 'info'];
  var SEV_HINT = {
    blocker: 'Must fix before merge: wrong behaviour, security hole, data loss, requirement violated',
    major: 'Should fix: convention or design problem with real cost, missing test for changed behaviour',
    minor: 'Worth fixing: readability, small inconsistency',
    info: 'Observation or question'
  };
  var CATS = {
    ai: ['conventions', 'consistency', 'reinvention', 'dead_code', 'overengineering', 'ai_artifacts', 'tests', 'error_handling', 'resources', 'performance', 'readability'],
    security: ['authz', 'authn', 'input_validation', 'injection', 'secrets', 'crypto', 'data_exposure', 'ssrf', 'deserialization', 'config', 'dependencies', 'logging'],
    spec: ['requirement', 'business_rule', 'decision', 'contract', 'unrequested', 'test_gap']
  };
  var CAT_LABEL = {
    dead_code: 'Dead code', overengineering: 'Over-engineering', ai_artifacts: 'AI artifacts', error_handling: 'Error handling',
    authz: 'Authorization', authn: 'Authentication', input_validation: 'Input validation', data_exposure: 'Data exposure',
    ssrf: 'SSRF', business_rule: 'Business rule', test_gap: 'Test gap', crypto: 'Crypto', config: 'Configuration'
  };
  var catLabel = function (c) {
    c = str(c);
    if (!c) return 'Uncategorised';
    if (CAT_LABEL[c]) return CAT_LABEL[c];
    var t = c.replace(/[_-]+/g, ' ');
    return t.charAt(0).toUpperCase() + t.slice(1);
  };
  var sevOf = function (s) { s = str(s).toLowerCase(); return SEVS.indexOf(s) >= 0 ? s : 'info'; };
  var sevBadge = function (s) { return h('span', { class: 'sev ' + s, 'data-tip': s + ': ' + SEV_HINT[s] }, s); };
  var loc = function (path, a, b) {
    var p = str(path);
    if (!p) return '';
    return p + (a != null && a !== '' ? ':' + a + (b != null && b !== '' && String(b) !== String(a) ? '–' + b : '') : '');
  };

  var change = obj(R.change), sources = obj(change.sources), scope = obj(R.scope);
  var kinds = {};
  strs(sources.spec).forEach(function (p) { kinds[p] = 'spec'; });
  strs(sources.plan).forEach(function (p) { kinds[p] = 'plan'; });
  strs(sources.conventions).forEach(function (p) { kinds[p] = 'conv'; });

  var findings = [];
  arr(R.findings).forEach(function (x, i) {
    x = obj(x);
    if (!Object.keys(x).length) return;
    var F = {
      raw: x, idx: i, id: str(x.id) || ('#' + (i + 1)), sev: sevOf(x.severity), cat: str(x.category),
      title: str(x.title) || str(x.description).slice(0, 90) || 'Finding', path: str(x.path),
      inferred: x.confidence !== 'verified'
    };
    F.loc = loc(F.path, x.line_start, x.line_end);
    F.search = [F.id, F.title, x.description, x.suggestion, F.path, F.cat, x.candidate, x.snippet].map(str).join('\n').toLowerCase();
    findings.push(F);
  });
  var sevRank = function (s) { return SEVS.indexOf(s); };
  findings.sort(function (a, b) { return sevRank(a.sev) - sevRank(b.sev) || (a.path < b.path ? -1 : a.path > b.path ? 1 : 0) || num(a.raw.line_start) - num(b.raw.line_start) || a.idx - b.idx; });
  var byId = {};
  findings.forEach(function (F) { byId[F.id] = F; });
  var toConfirm = arr(R.to_confirm).map(obj).filter(function (x) { return Object.keys(x).length; }).map(function (x, i) {
    var F = { raw: x, idx: i, id: str(x.id) || ('U-' + (i + 1)), sev: sevOf(x.severity), cat: str(x.category),
      title: str(x.title) || str(x.description).slice(0, 90) || 'Finding', path: str(x.path), inferred: x.confidence !== 'verified', unconfirmed: true };
    F.loc = loc(F.path, x.line_start, x.line_end);
    return F;
  }).sort(function (a, b) { return num(b.raw.certainty) - num(a.raw.certainty); });
  var certOf = function (x) { return x.certainty != null && isFinite(Number(x.certainty)) ? Math.round(Number(x.certainty)) : null; };

  var counts = { blocker: 0, major: 0, minor: 0, info: 0 };
  findings.forEach(function (F) { counts[F.sev]++; });
  var summary = obj(R.summary);
  // findings present win; the stored summary is used only when the list is empty
  if (!findings.length) SEVS.forEach(function (s) { if (summary[s] != null) counts[s] = num(summary[s]); });

  // files: declared list + any finding path
  var files = [], fileByPath = {};
  arr(R.files).map(obj).forEach(function (f) {
    var p = str(f.path);
    if (!p || fileByPath[p]) return;
    fileByPath[p] = { path: p, role: str(f.role), list: [] };
    files.push(fileByPath[p]);
  });
  findings.forEach(function (F) {
    if (!F.path) return;
    if (!fileByPath[F.path]) { fileByPath[F.path] = { path: F.path, role: '', list: [] }; files.push(fileByPath[F.path]); }
    fileByPath[F.path].list.push(F);
  });
  files.forEach(function (f) {
    f.worst = f.list.reduce(function (m, F) { return Math.min(m, sevRank(F.sev)); }, 9);
  });

  /* ================================================================ */
  /* top bar + header                                                 */
  /* ================================================================ */
  var title = KINDS[kind] || 'Review';
  var metaBits = [];
  if (change.branch) metaBits.push(h('span', { 'data-tip': 'Branch' }, '⎇ ' + str(change.branch)));
  if (change.boundary || change.base_ref) metaBits.push(h('span', { 'data-tip': 'Change boundary' },
    str(change.boundary || 'boundary') + (change.base_ref ? ' vs ' + str(change.base_ref) : '') + (change.base_commit ? ' @ ' + str(change.base_commit).slice(0, 10) : '')));
  if (R.generated_at) metaBits.push(h('span', { 'data-tip': 'Generated at' }, str(R.generated_at).replace('T', ' ')));
  app.appendChild(h('header', { class: 'topbar' }, [
    h('span', { class: 'brand' }, 'Code Review Assistant'),
    h('span', { class: 'title' }, title),
    h('span', { class: 'meta' }, metaBits),
    h('span', { class: 'spacer' }),
    h('span', { class: 'muted', style: { 'font-size': '11px' } }, [h('span', { class: 'kbd' }, '/'), ' search  ', h('span', { class: 'kbd' }, 'j'), h('span', { class: 'kbd' }, 'k'), ' move  ', h('span', { class: 'kbd' }, 'o'), ' open']),
    C.themeToggle()
  ]));

  function stat(k, v, tip) { return h('div', { class: 'stat', 'data-tip': tip || null }, [h('div', { class: 'k' }, k), h('div', { class: 'v' }, v == null ? '–' : C.fmt(v))]); }
  function pathChips(list, cls) {
    var l = strs(list);
    if (!l.length) return [h('span', { class: 'muted' }, '—')];
    return l.map(function (p) { return h('span', { class: 'chip ' + (cls || ''), 'data-tip': p }, C.basename(p) || p); });
  }
  var limitations = strs(R.limitations);
  app.appendChild(h('div', { class: 'rv-head' }, [
    C.card('Scope', kind ? h('code', null, 'review-' + kind) : null, [
      h('div', { class: 'stats' }, [
        stat('Files', scope.files != null ? num(scope.files) : null, 'Files in the change boundary'),
        stat('Reviewed', scope.reviewed != null ? num(scope.reviewed) : null, 'Files read by the reviewers'),
        stat('Mech. groups', scope.mechanical_groups_sampled != null ? num(scope.mechanical_groups_sampled) : null, 'Mechanical groups reviewed by sample'),
        stat('Excluded', scope.excluded != null ? num(scope.excluded) : null, 'Files excluded from review'),
        stat('Findings', findings.length)
      ]),
      h('div', { class: 'kv' }, [
        h('span', { class: 'k' }, 'Spec'), h('span', { class: 'v' }, pathChips(sources.spec, 'ok')),
        h('span', { class: 'k' }, 'Plan'), h('span', { class: 'v' }, pathChips(sources.plan, 'ok')),
        h('span', { class: 'k' }, 'Conventions'), h('span', { class: 'v' }, pathChips(sources.conventions, 'ok')),
        strs(sources.missing).length ? h('span', { class: 'k' }, 'Missing') : null,
        strs(sources.missing).length ? h('span', { class: 'v' }, strs(sources.missing).map(function (m) { return h('span', { class: 'chip miss' }, '✕ ' + m); })) : null
      ])
    ]),
    C.card('Limitations', limitations.length ? CRA.plural(limitations.length, 'item') : null,
      limitations.length ? h('ul', { class: 'ilist lim' }, limitations.map(function (l) { return h('li', null, [h('span', { class: 'ico' }, '⚠'), h('span', null, l)]); }))
        : h('div', { class: 'empty' }, 'No limitations reported.'))
  ]));

  /* ================================================================ */
  /* severity tiles + categories                                      */
  /* ================================================================ */
  var state = { group: 'severity', q: '', sev: '', cat: '', conf: '', file: '' };
  var DEFAULTS = { q: '', sev: '', cat: '', conf: '', file: '' };
  var tiles = {};
  app.appendChild(h('div', { class: 'sevs' }, SEVS.map(function (s) {
    var t = h('button', { type: 'button', class: 'stile ' + s + (counts[s] ? '' : ' zero'), 'data-tip': SEV_HINT[s] + '\nClick to filter',
      onclick: function () { setFilter({ sev: state.sev === s ? '' : s }, true); } },
      [h('span', { class: 'n' }, C.fmt(counts[s])), h('span', { class: 'l' }, s), h('span', { class: 'd' }, SEV_HINT[s].split(':')[0])]);
    tiles[s] = t;
    return t;
  })));

  var catOrder = (CATS[kind] || []).slice();
  findings.forEach(function (F) { if (catOrder.indexOf(F.cat) < 0) catOrder.push(F.cat); });
  var catCount = {};
  catOrder.forEach(function (c) { catCount[c] = { total: 0, blocker: 0, major: 0, minor: 0, info: 0 }; });
  findings.forEach(function (F) { catCount[F.cat].total++; catCount[F.cat][F.sev]++; });
  var maxCat = Math.max.apply(null, [1].concat(catOrder.map(function (c) { return catCount[c].total; })));
  var catRows = {};
  var catsEl = h('div', { class: 'cats' });
  catOrder.forEach(function (c) {

          h('span', { class: 'loc', 'data-tip': F.loc || 'no location' }, h('bdi', null, F.loc || '\u2014')), C.conf(F.raw.confidence), h('span', { class: 'caret' }, '\u25B8')]);
        var body = h('div', { hidden: true });
        var row = h('div', { class: 'fr unconf' + (F.inferred ? ' inferred' : '') }, [head, body]);
        head.addEventListener('click', function () {
          if (!row._built) { body.appendChild(detail(F)); row._built = true; }
          body.hidden = !body.hidden; row.classList.toggle('open', !body.hidden);
        });
        tcBox.appendChild(row);
      });
    });
    app.appendChild(tcDet);
  }

  /* ================================================================ */
  /* per-file view                                                    */
  /* ================================================================ */
  var fileRows = [];
  if (files.length) {
    var sortedFiles = files.slice().sort(function (a, b) { return a.worst - b.worst || b.list.length - a.list.length || (a.path < b.path ? -1 : 1); });
    var clean = sortedFiles.filter(function (f) { return !f.list.length; });
    var dirty = sortedFiles.filter(function (f) { return f.list.length; });
    var fileRow = function (f) {
      var c = { blocker: 0, major: 0, minor: 0, info: 0 };
      f.list.forEach(function (F) { c[F.sev]++; });
      var tr = h('tr', { class: f.list.length ? 'click' : null, onclick: f.list.length ? function () { setFilter(Object.assign({}, DEFAULTS, { file: state.file === f.path ? '' : f.path }), true); } : null }, [
        h('td', { class: 'p' }, C.pathEl(f.path)),
        h('td', { class: 'note-c' }, f.role || ''),
        h('td', { class: 'c-badge' }, f.list.length ? h('span', { class: 'cnts' }, SEVS.filter(function (s) { return c[s]; }).map(function (s) { return h('span', { class: 'sev ' + s, 'data-tip': c[s] + ' ' + s }, String(c[s])); })) : h('span', { class: 'muted' }, 'clean'))
      ]);
      fileRows.push({ el: tr, path: f.path });
      return tr;
    };
    var head = h('thead', null, h('tr', null, [h('th', null, 'File'), h('th', null, 'Role'), h('th', null, 'Findings')]));
    var tbl = h('table', { class: 'tbl files-tbl stackable' }, [head, h('tbody', null, dirty.map(fileRow))]);
    var body = [dirty.length ? tbl : h('div', { class: 'empty', style: { padding: '8px 12px' } }, 'No file has findings.')];
    if (clean.length) {
      var det = h('details', { class: 'disc', style: { padding: '8px 12px', 'border-top': '1px solid var(--border)' } }, h('summary', { class: 'muted' }, CRA.plural(clean.length, 'reviewed file') + ' without findings'));
      det.addEventListener('toggle', function () {
        if (!det.open || det._r) return;
        det._r = true;
        det.appendChild(h('table', { class: 'tbl files-tbl stackable' }, h('tbody', null, clean.map(fileRow))));
      });
      body.push(det);
    }
    app.appendChild(h('div', { class: 'section-title' }, [h('h2', null, 'Files'), h('span', { class: 'count' }, CRA.plural(dirty.length, 'file') + ' with findings · click to filter')]));
    app.appendChild(h('div', { class: 'card' }, body));
  }

  app.appendChild(h('div', { class: 'footer' }, ['Generated by code-review-assistant', R.report_dir ? [' · ', h('code', null, str(R.report_dir))] : null,
    R.schema_version != null ? ' · schema v' + str(R.schema_version) : null]));

  /* go */
  var g0 = 'severity';
  try { var sg = localStorage.getItem('cra-review-group'); if (sg === 'file' || sg === 'severity') g0 = sg; } catch (e) { /* ignore */ }
  setGroup(g0);
})();
</script>
</body>
</html>
