<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="code-review-assistant render_report.py">
<title>@@TITLE@@</title>
<style>
@@BASE_CSS@@
</style>
<style>
/* ---------- impact report ---------- */
.verdict {
  --mc: var(--m-unknown); --mbg: var(--m-unknown-bg);
  display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); gap: 0;
  border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow);
}
.verdict.m-static { --mc: var(--m-static); --mbg: var(--m-static-bg); }
.verdict.m-ai { --mc: var(--m-ai); --mbg: var(--m-ai-bg); }
.verdict.m-aih { --mc: var(--m-aih); --mbg: var(--m-aih-bg); }
.verdict.m-human { --mc: var(--m-human); --mbg: var(--m-human-bg); }
.v-mode { background: var(--mbg); border-right: 1px solid var(--border); padding: 14px 16px; border-left: 6px solid var(--mc); }
.v-mode .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.v-mode .name { font-size: 22px; font-weight: 750; color: var(--mc); line-height: 1.15; margin: 4px 0 2px; letter-spacing: -.01em; }
.v-mode code { font-size: 11px; color: var(--text-2); }
.v-mode .hint { margin-top: 8px; color: var(--text-2); font-size: 12px; }
.mscale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin-top: 12px; }
.mscale .ms { height: 7px; border-radius: 2px; background: var(--c); opacity: .22; }
.mscale .ms.on { opacity: 1; height: 9px; margin-top: -1px; box-shadow: 0 0 0 2px var(--surface); }
.mscale .sl { font-size: 9.5px; color: var(--text-3); text-align: center; margin-top: 3px; line-height: 1.15; }
.mscale .sl.on { color: var(--text); font-weight: 700; }
.v-body { padding: 12px 16px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.v-rule { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.v-rule code { background: var(--surface-2); padding: 1px 6px; border-radius: 3px; color: var(--text); }
.v-expl { font-size: 13px; color: var(--text); }
.v-dec { display: flex; flex-wrap: wrap; gap: 6px; }
.dchip-f {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0; padding: 3px 8px 3px 3px; border-radius: 6px;
  border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-size: 12px; text-align: left;
}
.dchip-f:hover { border-color: var(--text-3); background: var(--surface-2); }
.dchip-f.crit { border-color: var(--crit); box-shadow: inset 3px 0 0 var(--crit); padding-left: 6px; }
.dchip-f.inferred { border-style: dashed; }
.dchip-f .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-weight: 600; }
.dchip-f.inferred .t { font-style: italic; font-weight: 500; }
.dchip-f .fn { font-family: var(--mono); font-size: 11px; color: var(--text-3); white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.stat { background: var(--surface-2); border-radius: 5px; padding: 6px 9px; min-width: 0; }
.stat .k { font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; white-space: nowrap; }
.stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; white-space: nowrap; }
.stat .v .add { color: var(--st-new); } .stat .v .del { color: var(--st-removed); }
.stat .v small { font-size: 11px; font-weight: 500; color: var(--text-3); }
.stat.wide { grid-column: span 2; }
.sevb { display: inline-flex; align-items: center; gap: 4px; }
.sevb .sv { display: inline-flex; align-items: center; height: 22px; padding: 0 6px; border-radius: 5px; font: 800 11.5px/1 var(--font); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sevb .sc { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sevb .reach { font-size: 9px; font-weight: 800; color: var(--accent); white-space: nowrap; }
.stacked { margin-top: 10px; padding: 7px 12px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); font-size: 12.5px; font-weight: 600; border: 1px solid var(--warn); }
.hr-list { list-style: none; margin: 0; padding: 0; counter-reset: hr; }
.hr-list > li { counter-increment: hr; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 10px; padding: 9px 12px; border-top: 1px solid var(--border); }
.hr-list > li:first-child { border-top: 0; }
.hr-list > li::before { content: counter(hr); grid-row: span 3; width: 22px; height: 22px; border-radius: 11px; background: var(--m-aih); color: #fff; font: 800 11px/22px var(--font); text-align: center; }
.hr-list .hp { display: flex; gap: 8px; align-items: center; min-width: 0; flex-wrap: wrap; }
.hr-list .hp a { cursor: pointer; min-width: 0; display: flex; }
.hr-list .hp .fpath .base { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hr-list .hreason { color: var(--text-2); font-size: 12.5px; }
.hr-list .hq { list-style: none; padding: 0; margin: 3px 0 0; }
.hr-list .hq li { display: flex; gap: 7px; align-items: flex-start; font-size: 12.5px; padding: 2px 0; }
.hr-list .hq input { margin-top: 2px; flex: none; }
.hr-list .hq li.done label { color: var(--text-3); text-decoration: line-through; }
.hr-list .repl { font-size: 11.5px; color: var(--text-3); }
details.focus-sec { margin-top: 22px; }
details.focus-sec > summary { font-size: 14px; font-weight: 650; padding: 6px 0; }
.dang { list-style: none; padding: 0; margin: 6px 0 0; }
.dang li { font-size: 12px; padding: 3px 0; }
.dang .dl2 { font-family: var(--mono); font-size: 11.5px; color: var(--crit-text); }
.dang pre { margin: 2px 0 0; padding: 3px 8px; background: var(--crit-bg); border-radius: 4px; font-size: 11px; overflow-x: auto; }
.dang-tag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 3px; background: var(--crit); color: #fff; font-size: 10.5px; font-weight: 800; white-space: nowrap; }
.dang-ok { font-size: 11px; color: var(--ok); white-space: nowrap; }
.stat.human { background: var(--m-aih-bg); } .stat.human .v { color: var(--m-aih); }
.human-tag { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: 3px; font: 800 9.5px/1 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--m-aih); border: 1.5px solid var(--m-aih); white-space: nowrap; }
.fh .fh-crit { gap: 3px; flex-wrap: wrap; }
.v-human { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.v-human .chip { font-family: var(--mono); font-size: 11.5px; }
.stat.crit { background: var(--crit-bg); } .stat.crit .v { color: var(--crit-text); }
.lbar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; margin-top: 3px; background: var(--surface-3); }
.lbar .a { background: var(--st-new); } .lbar .d { background: var(--st-removed); }
@media (max-width: 760px) { .verdict { grid-template-columns: minmax(0, 1fr); } .v-mode { border-right: 0; border-bottom: 1px solid var(--border); } }

.ctx { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }
@media (max-width: 980px) { .ctx { grid-template-columns: minmax(0, 1fr); } }
.kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 5px 10px; align-items: baseline; font-size: 12px; }
.kv > .k { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.kv > .v { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.chip.ok::before { content: "\2713"; color: var(--ok); font-weight: 800; }
.chip.miss { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.chip.miss::before { content: "\2715"; font-weight: 800; }
.lim li { color: var(--text-2); }
.lim .ico { color: var(--warn); }

/* dimension profile */
.prof { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 0 12px; align-items: center; font-size: 12px; }
.prof .ph { font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; padding-bottom: 4px; }
.prof .r { display: contents; cursor: pointer; }
.prof .r > * { padding: 3px 0; border-top: 1px solid var(--border); }
.prof .r:hover > * { background: var(--surface-2); }
.prof .r.fam > * { border-top: 1px solid var(--border-strong); padding-top: 6px; }
.prof .r.fam .lab { font-weight: 700; }
.prof .r.dim .lab { padding-left: 16px; color: var(--text-2); }
.prof .r.none .lab { color: var(--text-3); }
.prof .r.sel > * { background: var(--accent-bg); }
.prof .lab { display: flex; align-items: center; gap: 7px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prof .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--dc); flex: none; }
.prof .r.dim .sw { width: 8px; height: 8px; border-radius: 50%; }
.pips { display: inline-flex; gap: 2px; align-items: center; }
.pips i { width: 14px; height: 10px; border-radius: 2px; background: var(--surface-3); display: inline-block; }
.pips i.p1 { background: var(--p1); } .pips i.p2 { background: var(--p2); } .pips i.p3 { background: var(--p3); }
.pips i.p4 { background: var(--p4); } .pips i.p5 { background: var(--p5); } .pips i.p0 { background: var(--p0); }
.pips b { font-size: 11px; width: 14px; text-align: right; font-variant-numeric: tabular-nums; margin-left: 4px; }
.fbar { display: inline-flex; align-items: center; gap: 6px; min-width: 120px; }
.fbar .bar { height: 8px; width: 70px; background: var(--surface-3); border-radius: 2px; overflow: hidden; display: inline-block; }
.fbar .bar span { display: block; height: 100%; background: var(--text-3); border-radius: 2px; }
.fbar .n { font-variant-numeric: tabular-nums; color: var(--text-2); min-width: 22px; }
.fbar .cr { color: var(--crit); font-weight: 700; font-size: 11px; display: inline-flex; gap: 3px; align-items: center; min-width: 34px; }

/* treemap */
.tm-host { width: 100%; min-height: 120px; }
.tm-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 6px; font-size: 11px; color: var(--text-3); align-items: center; }

/* heatmap */
.hm { display: grid; grid-template-columns: minmax(150px, 280px) repeat(12, minmax(22px, 1fr)); font-size: 11.5px; min-width: 560px; }
.hm-wrap { overflow-x: auto; }
.hm .fam { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); text-align: center;
  border-bottom: 3px solid var(--fc); padding: 2px 0; margin: 0 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hm .dh { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; padding: 4px 0; font-size: 10.5px; color: var(--text-2);
  display: flex; align-items: center; justify-content: flex-start; gap: 4px; height: 70px; margin: 0 auto; cursor: pointer; white-space: nowrap; }
.hm .dh .ddot { margin-bottom: 0; }
.hm .dh.sel { color: var(--accent); font-weight: 700; }
.hm .rl { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 0 8px 0 0; cursor: pointer; height: 22px; }
.hm .rl .rk { color: var(--text-3); font-size: 10.5px; width: 22px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.hm .rl .nm { font-family: var(--mono); font-size: 11.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hm .c { height: 20px; margin: 1px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10.5px; cursor: pointer; font-variant-numeric: tabular-nums; }
.hm .c.e { background: transparent; box-shadow: inset 0 0 0 1px var(--border); cursor: default; }
.hm .c.crit { box-shadow: inset 0 0 0 2px var(--crit); }
.hm .rowh:hover, .hm .rl:hover .nm { color: var(--accent); }
.hm-foot { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: 11px; color: var(--text-3); }
.hm-foot .cb { display: inline-block; width: 12px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 2px var(--crit); vertical-align: -2px; }

/* focus list */
.focus li { font-size: 12.5px; }

/* plan drift */
.drift { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 760px) { .drift { grid-template-columns: minmax(0, 1fr); } }
.drift h3 { font-size: 12px; display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.drift .ilist li { font-size: 12px; min-width: 0; }
.drift a.fl { cursor: pointer; min-width: 0; display: flex; }
.drift .fpath { min-width: 0; }
.drift .fpath .base { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* file list toolbar */
.toolbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 8px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}
.toolbar .search { flex: 1 1 220px; max-width: 360px; }
.toolbar .count { color: var(--text-3); font-size: 12px; margin-left: auto; white-space: nowrap; }
.active-filters { display: flex; gap: 6px; flex-wrap: wrap; }
.diffnote { font-size: 11.5px; color: var(--warn); background: var(--warn-bg); padding: 4px 10px; border-radius: 4px; margin-top: 8px; }

/* flows */
.flow { margin-top: 12px; }
.flow-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 2px; cursor: pointer; user-select: none; }
.flow-h .fname { font-weight: 700; font-size: 13px; }
.flow-h .fdesc { color: var(--text-3); font-size: 12px; }
.flow-h .tw { color: var(--text-3); font-size: 11px; width: 10px; transition: transform .12s; }
.flow.collapsed .flow-h .tw { transform: rotate(-90deg); }
.flow.collapsed .rows { display: none; }
.fstrip { display: inline-flex; gap: 2px; align-items: center; }
.fstrip i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.fstrip i.crit { box-shadow: 0 0 0 1.5px var(--crit); }
.fstrip .ar { color: var(--text-3); font-size: 9px; }
.rows { border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); overflow: hidden; }

/* file row */
.frow { border-top: 1px solid var(--border); }
.frow:first-child { border-top: 0; }
.frow.is-crit { box-shadow: inset 4px 0 0 var(--crit); }
.fh {
  display: grid; grid-template-columns: 30px 70px 86px 42px minmax(160px, 1.25fr) minmax(0, 1fr) auto 12px;
  gap: 8px; align-items: center; padding: 5px 10px 5px 12px; cursor: pointer; min-height: 34px;
}
.fh:hover { background: var(--surface-2); }
.frow.cur > .fh { background: var(--accent-bg); }
.frow.open > .fh { background: var(--surface-2); border-bottom: 1px solid var(--border); }
.fh .rank { color: var(--text-3); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
.fh .fh-crit { display: inline-flex; }
.fh .fh-st { display: inline-flex; gap: 3px; }
.fh .fh-titles { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.ft { display: flex; gap: 5px; align-items: center; min-width: 0; font-size: 12px; color: var(--text-2); }
.ft .pts { min-width: 15px; height: 15px; font-size: 9.5px; flex: none; }
.ft .ft-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ft.crit .ft-text { color: var(--crit-text); font-weight: 600; }
.ft.none { color: var(--text-3); font-style: italic; }
.fh .fh-dims { display: flex; gap: 3px; justify-content: flex-end; flex-wrap: wrap; }
.fh .caret { color: var(--text-3); font-size: 11px; transition: transform .12s; }
.frow.open .caret { transform: rotate(90deg); }
.frow.tier-mechanical .fpath .base { font-weight: 500; color: var(--text-2); }
@media (max-width: 900px) {
  .fh { grid-template-columns: 26px 70px 86px 42px minmax(0, 1fr) 12px; }
  .fh .fh-titles, .fh .fh-dims { grid-column: 2 / -1; justify-content: flex-start; }
}
@media (max-width: 600px) {
  .fh .fh-path { grid-column: 1 / -1; grid-row: 2; }
  .fh .fh-path .base { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .fh .fh-titles, .fh .fh-dims { grid-column: 1 / -1; }
}

/* expanded detail */
.fd { padding: 12px 14px 14px 16px; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 18px; background: var(--surface); }
@media (max-width: 1000px) { .fd { grid-template-columns: minmax(0, 1fr); } }
.fd .blk + .blk { margin-top: 14px; }
.fd .bh { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin-bottom: 5px; display: flex; gap: 8px; align-items: center; }
.fd .role { font-size: 13px; color: var(--text); }
.fd .full { grid-column: 1 / -1; }
.meta-g { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 4px 10px; font-size: 12px; align-items: baseline; }
.meta-g > .k { color: var(--text-3); }
.meta-g > .v { min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.meta-g .warn { color: var(--warn); font-weight: 600; }
.meta-g .good { color: var(--ok); font-weight: 600; }
.mini-list { font-family: var(--mono); font-size: 11.5px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.mini-list span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.fc { border: 1px solid var(--border); border-left: 4px solid var(--p3); border-radius: 5px; padding: 8px 10px; background: var(--surface); }
.fc + .fc { margin-top: 8px; }
.fc.inferred { border-left-style: dashed; }
.fc.crit { border-left-color: var(--crit); background: linear-gradient(90deg, var(--crit-bg), var(--surface) 55%); }
.fc-h { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.fc-title { font-weight: 650; font-size: 13px; min-width: 0; }
.fc.inferred .fc-title { font-style: italic; }
.fc-h .spacer { flex: 1; }
.fc-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 3px; font-size: 11px; color: var(--text-3); }
.fc-meta code { font-size: 10.5px; color: var(--text-3); }
.fc-reason { margin-top: 5px; font-size: 12.5px; color: var(--text); }
.fc-ev { margin-top: 6px; }
.fc-cons { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.fc-cons .chip { font-size: 11.5px; background: var(--surface-2); }
.fc-cons .chip::before { content: "\2192"; color: var(--text-3); }
.fc-lim { margin-top: 5px; font-size: 11.5px; color: var(--text-3); display: flex; gap: 5px; }
.fc-lim::before { content: "\26A0"; color: var(--warn); }
.verify { list-style: none; padding: 0; margin: 0; }
.verify li { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; font-size: 12.5px; }
.verify input { margin-top: 2px; flex: none; }
.verify li.done label { color: var(--text-3); text-decoration: line-through; }
.diffbox { margin-top: 4px; }
.diffbox > summary { font-size: 12px; font-weight: 600; color: var(--text-2); padding: 4px 0; }

/* groups & excluded */
.grp { border-top: 1px solid var(--border); padding: 7px 12px; }
.grp:first-child { border-top: 0; }
.grp > summary { font-size: 12.5px; }
.grp .gk { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.grp .gd { font-weight: 600; }
.grp .gn { margin-left: auto; color: var(--text-3); font-size: 11.5px; white-space: nowrap; }
.grp .gbody { padding: 6px 0 2px 16px; }
.grp .sample { font: 11.5px/1.5 var(--mono); background: var(--surface-2); border-radius: 4px; padding: 4px 8px; white-space: pre; overflow-x: auto; margin-bottom: 6px; }
.grp .sample.del { background: var(--del-bg); color: var(--del-fg); }
.grp .sample.add { background: var(--add-bg); color: var(--add-fg); }
.grp .gfiles { columns: 2 340px; column-gap: 20px; }
.grp .gfiles a { display: block; cursor: pointer; break-inside: avoid; padding: 1px 0; }
.excl td.p { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
.excl td.r { color: var(--text-2); }
</style>
</head>
<body>
<div class="page" id="app"><noscript><p style="padding:20px">This report renders with JavaScript. Enable it to view the report.</p></noscript></div>
<script type="application/json" id="cra-data">@@DATA_JSON@@</script>
<script type="application/json" id="cra-diffs">@@DIFFS_JSON@@</script>
<script>
@@COMPONENTS_JS@@
</script>
<script>
(function () {
  'use strict';
  var C = window.CRA, h = C.h, arr = C.arr, obj = C.obj, str = C.str, num = C.num, strs = C.strs;
  var app = document.getElementById('app');

  listSection.appendChild(emptyEl);

  function setView(v) {
    state.view = v;
    try { localStorage.setItem('cra-view', v); } catch (e) { /* ignore */ }
    btnFlows.setAttribute('aria-pressed', String(v === 'flows'));
    btnRank.setAttribute('aria-pressed', String(v === 'ranking'));
    if (v === 'flows') {
      flowGroups.forEach(function (g) { g.files.forEach(function (F) { g.box.appendChild(rows[F.idx]); }); });
      if (rankBox.parentNode) listSection.removeChild(rankBox);
      listSection.insertBefore(flowsBox, emptyEl);
    } else {
      ranked.forEach(function (F) { rankBox.appendChild(rows[F.idx]); });
      if (flowsBox.parentNode) listSection.removeChild(flowsBox);
      listSection.insertBefore(rankBox, emptyEl);
    }
    applyFilters();
  }

  /* ---------- filtering ---------- */
  function matches(F) {
    var s = state;
    if (s.q) {
      var toks = s.q.toLowerCase().split(/\s+/).filter(Boolean);
      for (var i = 0; i < toks.length; i++) if (F.search.indexOf(toks[i]) < 0) return false;
    }
    if (s.dim) { if (F.dims[s.dim] == null || F.dims[s.dim] < s.minPts) return false; }
    else if (s.minPts > 0 && F.maxPts < s.minPts) return false;
    if (s.tier && F.tier !== s.tier) return false;
    if (s.critOnly && !F.critical) return false;
    if (s.status && F.status !== s.status) return false;
    if (s.untracked && !F.untracked) return false;
    if (s.module && F.module !== s.module) return false;
    if (s.humanOnly && !F.human) return false;
    return true;
  }
  function applyFilters() {
    var n = 0;
    ranked.forEach(function (F) { var m = matches(F); rows[F.idx].hidden = !m; if (m) n++; });
    flowGroups.forEach(function (g) { g.sec.hidden = !g.files.some(function (F) { return !rows[F.idx].hidden; }); });
    emptyEl.hidden = n > 0 || !ranked.length;
    if (!ranked.length) { emptyEl.hidden = false; emptyEl.textContent = 'No analysed files in this change.'; }
    countEl.textContent = n === ranked.length ? ranked.length + ' files' : n + ' of ' + ranked.length + ' files';
    // active filter chips
    activeEl.innerHTML = '';
    if (state.module) activeEl.appendChild(h('span', { class: 'chip' }, ['module: ' + state.module, h('span', { class: 'x', onclick: function () { setFilter({ module: '' }); } }, '✕')]));
    var any = JSON.stringify(pick(state)) !== JSON.stringify(DEFAULTS);
    resetBtn.hidden = !any;
    if (any) C.$$('.flow.mech', flowsBox).forEach(function (sec) { sec.classList.remove('collapsed'); });
    // reflect selections
    Object.keys(profRows).forEach(function (k) { profRows[k].classList.toggle('sel', state.dim === k); });
    Object.keys(dhEls).forEach(function (k) { dhEls[k].classList.toggle('sel', state.dim === k); });
    if (cur && cur.hidden) setCurrent(null);
  }
  function pick(s) { var o = {}; Object.keys(DEFAULTS).forEach(function (k) { o[k] = s[k]; }); return o; }
  function setFilter(patch, scroll) {
    var moduleChanged = patch.module !== undefined && patch.module !== state.module;
    Object.keys(patch).forEach(function (k) { state[k] = patch[k]; });
    search.value = state.q; selDim.value = state.dim; selPts.value = String(state.minPts); selTier.value = state.tier;
    selStatus.value = state.status; cbCrit.checked = state.critOnly; cbUntr.checked = state.untracked; cbHuman.checked = state.humanOnly;
    applyFilters();
    if (moduleChanged || patch.module === '') drawTreemap();
    if (scroll) toolbar.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------- navigation ---------- */
  var cur = null;
  function setCurrent(row) {
    if (cur) cur.classList.remove('cur');
    cur = row;
    if (cur) cur.classList.add('cur');
  }
  function visibleRows() {
    var box = state.view === 'flows' ? flowsBox : rankBox;
    return C.$$('.frow', box).filter(function (r) {
      if (r.hidden) return false;
      var sec = r.closest('.flow');
      return !sec || (!sec.hidden && !sec.classList.contains('collapsed'));
    });
  }
  function move(d) {
    var list = visibleRows();
    if (!list.length) return;
    var i = cur ? list.indexOf(cur) : -1;
    i = i < 0 ? (d > 0 ? 0 : list.length - 1) : Math.max(0, Math.min(list.length - 1, i + d));
    setCurrent(list[i]);
    list[i]._head.focus({ preventScroll: true });
    list[i].scrollIntoView({ block: 'nearest' });
    var tb = toolbar.getBoundingClientRect(), rr = list[i].getBoundingClientRect();
    if (rr.top < tb.bottom) window.scrollBy(0, rr.top - tb.bottom - 4);
  }
  function jumpTo(F, finding) {
    if (F.tier === 'excluded') {
      var ex = document.getElementById('excl-' + F.idx);
      if (ex) { ex.scrollIntoView({ behavior: 'smooth', block: 'center' }); ex.classList.add('flash'); setTimeout(function () { ex.classList.remove('flash'); }, 1300); }
      return;
    }
    var row = rows[F.idx];
    if (!row) return;
    if (!matches(F)) setFilter(DEFAULTS);
    var sec = row.closest('.flow');
    if (sec) sec.classList.remove('collapsed');
    toggle(F, true);
    setCurrent(row);
    var target = finding && finding.id != null ? document.getElementById('fnd-' + str(finding.id)) : null;
    var y = row.getBoundingClientRect().top + window.pageYOffset - toolbar.offsetHeight - 8;
    window.scrollTo({ top: y, behavior: 'smooth' });
    row.classList.add('flash'); setTimeout(function () { row.classList.remove('flash'); }, 1300);
    if (target) { target.classList.add('flash'); setTimeout(function () { target.classList.remove('flash'); }, 1600); }
  }

  document.addEventListener('keydown', function (e) {
    var t = e.target, tag = (t.tagName || '').toLowerCase();
    var typing = tag === 'input' && !/checkbox|radio/.test(t.type) || tag === 'textarea' || tag === 'select' || t.isContentEditable;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (typing) {
      if (e.key === 'Escape') t.blur();
      if (e.key === 'Enter' && t === search) { t.blur(); setCurrent(null); move(1); e.preventDefault(); }
      return;
    }
    if (e.key === '/') { e.preventDefault(); search.focus(); search.select(); return; }
    if (e.key === 'j' || e.key === 'k') { e.preventDefault(); move(e.key === 'j' ? 1 : -1); return; }
    var onHead = t.classList && t.classList.contains('fh');
    if ((e.key === 'o' || (e.key === 'Enter' && (onHead || t === document.body))) && cur) { e.preventDefault(); toggle(cur._F); return; }
    if (e.key === ' ' && onHead) { e.preventDefault(); toggle(t.parentNode._F); }
  });

  /* ================================================================ */
  /* mechanical groups + excluded                                     */
  /* ================================================================ */
  var groups = arr(A.groups).map(obj).filter(function (g) { return Object.keys(g).length; });
  if (groups.length) {
    var gsum = groups.reduce(function (a, g) { return a + strs(g.files).length; }, 0);
    var hasDel = groups.some(function (g) { return g.kind === 'deleted_module'; });
    app.appendChild(h('div', { class: 'section-title' }, [h('h2', null, hasDel ? 'Groups' : 'Mechanical groups'), h('span', { class: 'count' }, CRA.plural(groups.length, 'group') + ' · ' + CRA.plural(gsum, 'file') + ' · assessed as groups, not file by file')]));
    app.appendChild(h('div', { class: 'card' }, groups.map(function (g) {
      var gf = strs(g.files);
      var isDel = g.kind === 'deleted_module';
      var dang = arr(g.dangling_refs).map(function (d) { return typeof d === 'string' ? { path: d } : obj(d); }).filter(function (d) { return d.path || d.snippet; });
      var det = h('details', { class: 'disc grp', open: isDel && dang.length ? true : null }, h('summary', null, isDel ? [
        h('span', { class: 'gk' }, 'deleted module'), h('span', { class: 'gd' }, 'Deleted module ' + (str(g.root) || str(g.id) || '') + ' (' + CRA.plural(gf.length, 'file') + ')'),
        str(g.description) ? h('span', { class: 'muted', style: { 'font-size': '12px' } }, str(g.description)) : null,
        h('span', { class: 'gn' }, dang.length ? h('span', { class: 'dang-tag', 'data-tip': 'Code outside the module still references it' }, 'still referenced (' + dang.length + ')') : h('span', { class: 'dang-ok' }, '\u2713 no dangling references'))
      ] : [
        g.kind ? h('span', { class: 'gk' }, str(g.kind)) : null, h('span', { class: 'gd' }, str(g.description) || str(g.id) || 'Group'),
        h('span', { class: 'gn' }, CRA.plural(gf.length, 'file'))]));
      var render = function () {
        if (!det.open || det._r) return;
        det._r = true;
        var sl = str(g.sample_line);
        det.appendChild(h('div', { class: 'gbody' }, [
          dang.length ? h('ul', { class: 'dang' }, dang.map(function (d) {
            var l = str(d.path) + (d.line != null ? ':' + d.line : '');
            return h('li', null, [h('span', { class: 'dl2', 'data-tip': l }, l), d.snippet ? h('pre', null, str(d.snippet)) : null]);
          })) : null,
          sl ? h('div', { class: 'sample ' + (sl.charAt(0) === '-' ? 'del' : sl.charAt(0) === '+' ? 'add' : '') }, sl) : null,
          gf.length ? h('div', { class: 'gfiles' }, gf.map(function (p) {
            var F = byPath[p];
            return F ? h('a', { onclick: function () { jumpTo(F); } }, C.pathEl(p)) : h('div', null, C.pathEl(p));
          })) : h('div', { class: 'empty' }, 'No files listed.')
        ]));
      };
      det.addEventListener('toggle', render);
      if (det.open) render();
      return det;
    })));
  }
  if (excluded.length) {
    app.appendChild(h('div', { class: 'section-title' }, [h('h2', null, 'Excluded files'), h('span', { class: 'count' }, CRA.plural(excluded.length, 'file') + ' · not analysed')]));
    app.appendChild(h('div', { class: 'card' }, h('table', { class: 'tbl excl stackable' }, [
      h('thead', null, h('tr', null, [h('th', null, 'File'), h('th', null, 'Reason'), h('th', null, 'Lines')])),
      h('tbody', null, excluded.map(function (F) {
        return h('tr', { id: 'excl-' + F.idx }, [h('td', { class: 'p' }, [C.statusEl(F.status), ' ', F.path]),
          h('td', { class: 'r' }, str(F.raw.excluded_reason) || strs(F.raw.tier_reasons).join(' · ') || 'excluded'),
          h('td', { class: 'nowrap muted' }, '+' + C.fmt(F.raw.added_lines) + ' −' + C.fmt(F.raw.deleted_lines))]);
      }))
    ])));
  }
  if (focus.length) {
    app.appendChild(h('details', { class: 'disc focus-sec card', style: { padding: '6px 12px' } }, [
      h('summary', null, ['AI review focus (' + focus.length + ')', h('span', { class: 'muted', style: { 'font-size': '12px', 'font-weight': '400' } }, '— also in ai-review-focus.md'),
        h('span', { style: { 'margin-left': 'auto' } }, C.copyBtn(function () { return focus.map(function (x) { return '- ' + x; }).join('\n'); }, 'Copy all'))]),
      h('ol', { class: 'olist focus', style: { padding: '4px 0 8px' } }, focus.map(function (x) { return h('li', null, x); }))
    ]));
  }
  app.appendChild(h('div', { class: 'footer' }, ['Generated by code-review-assistant', A.report_dir ? [' · ', h('code', null, str(A.report_dir))] : null,
    A.schema_version != null ? ' · schema v' + str(A.schema_version) : null]));

  /* ---------- go ---------- */
  setView(state.view);
  drawTreemap();
  var lastW = tmHost.clientWidth;
  window.addEventListener('resize', C.debounce(function () { if (tmHost.clientWidth !== lastW) { lastW = tmHost.clientWidth; drawTreemap(); } }, 150));
  if (location.hash && /^#file-\d+$/.test(location.hash)) {
    var F0 = allFiles.filter(function (F) { return 'file-' + F.idx === location.hash.slice(1); })[0];
    if (F0) jumpTo(F0);
  }
})();
</script>
</body>
</html>
